spring:
  application:
    name: charm-api

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

logging:
  structured:
    format:
      console: logstash

app:
  jwt:
    issuer: charm-api
    secret: ${JWT_SECRET}
    access-token-ttl: 1h

  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL}

  storage:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    download-url-ttl: ${S3_DOWNLOAD_URL_TTL}

  rate-limit:
    login:
      capacity: 10
      refill-period: 1m
    registration:
      capacity: 5
      refill-period: 1h
    refresh:
      capacity: 30
      refill-period: 1m

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never

      probes:
        enabled: true

      group:
        liveness:
          include: livenessState
          additional-path: "server:/health"

        readiness:
          include: readinessState,db,redis
          additional-path: "server:/ready"
